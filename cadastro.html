<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntários - ONG Esperança Viva</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <img src="imagens/logo-ong.png" alt="Logotipo da ONG Esperança Viva">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">&#9776;</label>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Formulário de Cadastro para Voluntariado</h1>

        <!-- Alerta de Sucesso -->
        <div class="alert alert-success">
            <strong>Tudo certo!</strong> Preencha os campos abaixo para concluir a sua inscrição.
        </div>

        <form action="#" method="post" style="grid-column: span 12; display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem;">
            
            <fieldset>
                <legend style="padding: 0 0.5rem; font-weight: bold;">Dados Pessoais</legend>
                <br>
                <p>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required value="Maria da Silva">
                </p>
                <br>
                <p>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" value="123.456.789-00">
                </p>
            </fieldset>

            <fieldset>
                <legend style="padding: 0 0.5rem; font-weight: bold;">Informações de Contato</legend>
                <br>
                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required value="maria@exemplo.com">
                </p>
                <br>
                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required value="(11) 98765-4321">
                </p>
            </fieldset>

            <div style="grid-column: span 12; text-align: center; margin-top: 1rem;">
                <button type="submit">Enviar Cadastro</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança Viva. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
