<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">&#9776;</label>
        <nav>
            <ul>
                <li><a href="#inicio" class="nav-link">Início</a></li>
